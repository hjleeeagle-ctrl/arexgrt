<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>통합 교통 시각표 (공항철도 & 701 GRT 버스)</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 flex flex-col items-center p-3 sm:p-6">

    <main class="w-full max-w-2xl bg-white rounded-2xl shadow-xl overflow-hidden border border-slate-200 my-auto">
        <!-- Header -->
        <header class="bg-gradient-to-r from-cyan-600 to-blue-700 text-white p-6 relative">
            <div class="flex justify-between items-center mb-3">
                <span id="app-type-badge" class="bg-white/20 text-xs px-3 py-1 rounded-full font-semibold backdrop-blur-sm">
                    공항철도 & 버스 통합 안내
                </span>
                <span id="current-live-time" class="text-xs font-mono bg-black/20 px-2 py-1 rounded">--:--:--</span>
            </div>

            <!-- Header Title Dynamic -->
            <div class="flex items-center gap-3">
                <h1 id="main-title" class="text-2xl sm:text-3xl font-extrabold tracking-tight">🚆 공항철도 (AREX)</h1>
            </div>
            <p id="main-subtitle" class="text-cyan-100 text-sm mt-1">열차 실시간 및 지정시간 출발 정보</p>

            <!-- Mode Switcher Tabs (Train vs Bus) -->
            <div class="grid grid-cols-2 gap-2 mt-5 bg-black/20 p-1.5 rounded-xl backdrop-blur-sm">
                <button id="tab-train" onclick="setAppMode('train')" class="py-2.5 text-xs sm:text-sm font-bold rounded-lg transition-all duration-200 bg-white text-blue-700 shadow-md">
                    <i class="fa-solid fa-train"></i> 공항철도 (AREX)
                </button>
                <button id="tab-bus" onclick="setAppMode('bus')" class="py-2.5 text-xs sm:text-sm font-bold rounded-lg transition-all duration-200 text-white/80 hover:text-white hover:bg-white/10">
                    <i class="fa-solid fa-bus"></i> 701 GRT 버스
                </button>
            </div>
        </header>

        <!-- Common Control Panel -->
        <section class="p-5 sm:p-6 border-b border-slate-100 bg-slate-50 space-y-4">
            
            <!-- 1. TRAIN SPECIFIC SELECTORS -->
            <div id="train-selectors" class="space-y-4">
                <!-- Station Selector -->
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5">기준 역 선택</label>
                    <div class="grid grid-cols-2 gap-2 bg-slate-200 p-1 rounded-xl">
                        <button id="btn-station-cheongna" onclick="setTrainStation('cheongna')" class="py-2 text-xs sm:text-sm font-bold rounded-lg transition-all shadow-sm bg-white text-blue-600">
                            청라국제도시역
                        </button>
                        <button id="btn-station-incheon2" onclick="setTrainStation('incheon2')" class="py-2 text-xs sm:text-sm font-bold rounded-lg transition-all text-slate-600 hover:text-slate-900">
                            인천공항2터미널역
                        </button>
                    </div>
                </div>

                <!-- Direction Selector -->
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5">행선지 선택</label>
                    <div id="direction-container" class="grid grid-cols-2 gap-2">
                        <!-- Populated by JS -->
                    </div>
                </div>
            </div>

            <!-- 2. BUS SPECIFIC SELECTORS -->
            <div id="bus-selectors" class="space-y-4 hidden">
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5">출발지 선택</label>
                    <div class="grid grid-cols-2 gap-2 bg-slate-200 p-1 rounded-xl">
                        <button id="btn-bus-701" onclick="setBusRoute('701')" class="py-2 text-xs sm:text-sm font-bold rounded-lg transition-all shadow-sm bg-white text-blue-600">
                            가정역 출발 (701)
                        </button>
                        <button id="btn-bus-cheongna" onclick="setBusRoute('청라역')" class="py-2 text-xs sm:text-sm font-bold rounded-lg transition-all text-slate-600 hover:text-slate-900">
                            청라역 출발 (701)
                        </button>
                    </div>
                </div>

                <!-- API Realtime Bus Arrival Card -->
                <div class="bg-gradient-to-br from-emerald-900 to-teal-900 text-white p-4 rounded-xl shadow-inner border border-emerald-700/50">
                    <div class="flex items-center justify-between mb-2">
                        <span class="text-xs font-bold bg-emerald-500/30 text-emerald-200 px-2.5 py-0.5 rounded-full border border-emerald-400/30 flex items-center gap-1.5">
                            <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                            API 실시간 위치 연동
                        </span>
                        <button onclick="fetchApiBusArrival()" class="text-xs bg-emerald-700 hover:bg-emerald-600 text-white font-semibold px-2 py-1 rounded transition-colors flex items-center gap-1">
                            <i class="fa-solid fa-rotate-right"></i> 새로고침
                        </button>
                    </div>

                    <div id="api-arrival-content" class="text-xs space-y-1.5 pt-1">
                        <div class="flex justify-between items-center text-slate-300">
                            <span>도착 예정 시간:</span>
                            <span id="api-time" class="font-bold text-base text-yellow-300 font-mono">조회 중...</span>
                        </div>
                        <div class="flex justify-between items-center text-slate-300">
                            <span>남은 정류장:</span>
                            <span id="api-rest-count" class="font-bold text-emerald-200">--</span>
                        </div>
                        <div class="flex justify-between items-center text-slate-300">
                            <span>최근 정류소:</span>
                            <span id="api-latest-stop" class="font-medium text-slate-200 truncate max-w-[180px]">--</span>
                        </div>
                        <div class="flex justify-between items-center text-slate-300">
                            <span>차량 번호판:</span>
                            <span id="api-num-plate" class="font-mono text-slate-200">--</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 3. SHARED DAY TYPE SELECTOR -->
            <div>
                <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5">운행 요일 구분</label>
                <div class="grid grid-cols-2 gap-2 bg-slate-200 p-1 rounded-xl">
                    <button id="btn-weekday" onclick="setDayType('weekday')" class="py-2 text-xs sm:text-sm font-bold rounded-lg transition-all shadow-sm bg-white text-blue-600">
                        평일 시간표
                    </button>
                    <button id="btn-weekend" onclick="setDayType('weekend')" class="py-2 text-xs sm:text-sm font-bold rounded-lg transition-all text-slate-600 hover:text-slate-900">
                        주말 / 공휴일 시간표
                    </button>
                </div>
            </div>

            <!-- 4. SHARED TIME CONTROLS -->
            <div>
                <div class="flex justify-between items-center mb-1.5">
                    <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider">기준 시각 설정</label>
                    <label class="flex items-center gap-2 text-xs text-slate-600 font-semibold cursor-pointer">
                        <input type="checkbox" id="chk-realtime" checked onchange="toggleRealtimeMode(this.checked)" class="w-4 h-4 text-blue-600 rounded focus:ring-blue-500 border-slate-300">
                        현재 시간 실시간 연동
                    </label>
                </div>
                <div class="flex gap-2">
                    <input type="time" id="time-picker" disabled onchange="onCustomTimeChange(this.value)" class="w-full px-4 py-2 rounded-xl border border-slate-300 font-mono text-base font-bold bg-slate-100 text-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition-all">
                    <button id="btn-now" onclick="resetToNow()" class="px-4 py-2 bg-slate-800 text-white font-bold rounded-xl text-xs hover:bg-slate-700 transition-colors whitespace-nowrap">
                        지금 시각
                    </button>
                </div>
            </div>
        </section>

        <!-- Dynamic Results Section -->
        <section class="p-5 sm:p-6">
            <div class="flex items-center justify-between mb-4">
                <h2 id="result-section-title" class="text-sm font-bold text-slate-700 flex items-center gap-2">
                    <i class="fa-regular fa-clock text-blue-600"></i> 열차 운행 정보
                </h2>
                <div class="flex items-center gap-2">
                    <button id="btn-copy-bus" onclick="copyBusResults()" class="hidden px-2.5 py-1 text-xs font-bold bg-slate-100 hover:bg-slate-200 border border-slate-300 rounded-lg text-slate-700 transition-all">
                        <i class="fa-regular fa-copy"></i> 결과 복사
                    </button>
                    <span id="reference-time-display" class="text-xs font-medium text-slate-500 bg-slate-100 px-2.5 py-1 rounded-full">
                        기준 시각: --:--
                    </span>
                </div>
            </div>

            <!-- Output Container -->
            <div id="results-list" class="space-y-3">
                <!-- Content generated via JavaScript -->
            </div>
        </section>
    </main>

        function normalizeServiceKey(key) {
            try { return decodeURIComponent(key); } catch (_) { return key; }
        }

        function firstValue(object, names) {
            if (!object || typeof object !== 'object') return undefined;
            const normalized = Object.fromEntries(Object.entries(object).map(([key, value]) => [key.toUpperCase(), value]));
            for (const name of names) {
                const value = normalized[name.toUpperCase()];
                if (value !== undefined && value !== null && value !== '') return value;
            }
            return undefined;
        }

        function getApiError(data) {
            const errorHeader = data?.OpenAPI_ServiceResponse?.cmmMsgHeader;
            const header = data?.ServiceResult?.msgHeader || data?.response?.header || data?.header;
            const code = firstValue(errorHeader || header, ['returnReasonCode', 'resultCode', 'resultCode']);
            const message = firstValue(errorHeader || header, ['returnAuthMsg', 'errMsg', 'resultMessage', 'resultMsg']);
            return code && String(code) !== '0' ? (message || `API 오류 코드 ${code}`) : null;
        }

        function findArrivalItems(data) {
            const root = data?.ServiceResult || data?.response || data;
            const body = root?.msgBody || root?.body || root?.response?.body;
            const items = body?.itemList || body?.items?.item || body?.items || root?.itemList;
            if (!items) return [];
            return Array.isArray(items) ? items : [items];
        }

        function parseArrivalResponse(rawText) {
            const text = rawText.trim();
            if (!text) throw new Error('빈 응답');

            if (text.startsWith('{') || text.startsWith('[')) {
                const data = JSON.parse(text);
                const apiError = getApiError(data);
                if (apiError) return { error: apiError };
                return { items: findArrivalItems(data) };
            }

            const xml = new DOMParser().parseFromString(text, 'application/xml');
            if (xml.querySelector('parsererror')) throw new Error('XML 형식 오류');
            const error = xml.querySelector('cmmMsgHeader > errMsg, cmmMsgHeader > returnAuthMsg, msgHeader > resultMessage, msgHeader > resultMsg')?.textContent?.trim();
            const code = xml.querySelector('cmmMsgHeader > returnReasonCode, msgHeader > resultCode')?.textContent?.trim();
            if (code && code !== '0') return { error: error || `API 오류 코드 ${code}` };

            // Incheon API uses itemList (not item) in its XML response.
            const items = [...xml.querySelectorAll('msgBody > itemList, itemList, item')].map((item) =>
                Object.fromEntries([...item.children].map((child) => [child.tagName, child.textContent.trim()]))
            );
            return { items };
        }

        // Direct HTTPS calls are used: the API's CORS preflight permits GET.
        // Do not send the key through an unrelated public CORS proxy.
        async function fetchApiBusArrival() {
            const route = incheonBusApi.routes[state.busRoute];
            if (!route?.routeId || !route?.bstopId) {
                setArrivalStatus('설정 필요', '선택한 출발지의 API 정류소 ID를 확인해 주세요');
                return;
            }

            setArrivalStatus('실시간 조회 중...', '');
            const params = new URLSearchParams({
                serviceKey: normalizeServiceKey(incheonBusApi.serviceKey),
                pageNo: '1',
                numOfRows: '10',
                routeId: route.routeId,
                bstopId: route.bstopId
            });
            const controller = new AbortController();
            const timeout = setTimeout(() => controller.abort(), 12000);

            try {
                const response = await fetch(`${incheonBusApi.endpoint}?${params}`, {
                    signal: controller.signal,
                    // This endpoint returns XML. Adding `_type=json` produces an API HTTP_ERROR.
                    headers: { Accept: 'application/xml, text/xml;q=0.9' }
                });
                const rawText = await response.text();
                if (!response.ok) throw new Error(`HTTP ${response.status}`);

                const result = parseArrivalResponse(rawText);
                if (result.error) {
                    setArrivalStatus('API 인증/요청 오류', result.error);
                    return;
                }
                if (!result.items?.length) {
                    setArrivalStatus('운행 정보 없음', '현재 접근 중인 차량이 없거나 도착 정보가 없습니다');
                    return;
                }

                const item = result.items[0];
                updateArrivalUI(
                    firstValue(item, ['ARRIVALESTIMATETIME', 'arrivalEstimateTime']),
                    firstValue(item, ['REST_STOP_COUNT', 'restStopCount']),
                    firstValue(item, ['LATEST_STOP_NAME', 'latestStopName']),
                    firstValue(item, ['BUS_NUM_PLATE', 'busNumPlate'])
                );
            } catch (error) {
                console.error('Bus arrival API request failed:', error);
                const message = error.name === 'AbortError' ? '요청 시간이 초과되었습니다' : '네트워크 또는 API 응답을 확인해 주세요';
                setArrivalStatus('조회 실패', message);
            } finally {
                clearTimeout(timeout);
            }
        }

            const secNum = Number.parseInt(arrivalSec, 10);
            if (Number.isFinite(secNum) && secNum > 0) {
                const minutes = Math.floor(secNum / 60);
                const seconds = secNum % 60;
                timeEl.innerText = `${minutes}분 ${seconds}초 후`;

            latestStopEl.innerText = latestStop || '-';
            numPlateEl.innerText = numPlate || '-';

        function timeToMinutes(timeStr) {
            const [h, m] = timeStr.split(':').map(Number);

        function renderTrainSchedule() {
            const listContainer = document.getElementById('results-list');
            listContainer.innerHTML = '';

            const stationData = trainTimetable[state.trainStation];
            const scheduleList = stationData[state.dayType][state.direction];

            const currentMins = timeToMinutes(state.selectedTime);

            let pastTrain = null;
            let upcomingTrains = [];

            for (let i = 0; i < scheduleList.length; i++) {
                const trainMins = timeToMinutes(scheduleList[i]);
                if (trainMins < currentMins) {
                    pastTrain = scheduleList[i];
                } else {
                    upcomingTrains.push(scheduleList[i]);
                    if (upcomingTrains.length === 4) break;
                }
            }

            if (pastTrain) {
                const diff = currentMins - timeToMinutes(pastTrain);
                listContainer.appendChild(createTrainCardHtml(pastTrain, `전 열차 (${diff}분 전 출발)`, true));
            }

            if (upcomingTrains.length === 0) {
                listContainer.innerHTML += `
                    <div class="text-center py-10 text-slate-400 font-medium">
                        오늘 운행이 종료되었거나 열차 정보가 없습니다.
                    </div>
                `;
            } else {
                upcomingTrains.forEach((timeStr, idx) => {
                    const diff = timeToMinutes(timeStr) - currentMins;
                    let label = `${idx + 1}번째 열차`;
                    if (diff === 0) label += " (곧 출발)";
                    else label += ` (${diff}분 후)`;
                    listContainer.appendChild(createTrainCardHtml(timeStr, label, false, idx === 0));
                });
            }
        }

        function createTrainCardHtml(timeStr, statusLabel, isPast = false, isNext = false) {
            const div = document.createElement('div');
            
            let cardStyle = "bg-white border-slate-200 text-slate-800";
            let badgeStyle = "bg-slate-100 text-slate-600";
            
            if (isPast) {
                cardStyle = "bg-slate-50 border-slate-200 opacity-60";
            } else if (isNext) {
                cardStyle = "bg-gradient-to-r from-blue-50 to-indigo-50 border-blue-300 shadow-sm ring-1 ring-blue-400/30";
                badgeStyle = "bg-blue-600 text-white font-bold";
            }

            const destinationText = (state.direction === 'seoul') ? '서울역 방면' : '인천공항2터미널 방면';

            div.className = `flex items-center justify-between p-4 rounded-xl border ${cardStyle} transition-all`;
            div.innerHTML = `
                <div class="flex items-center gap-3 sm:gap-4">
                    <div class="w-10 h-10 sm:w-12 sm:h-12 rounded-full ${isNext ? 'bg-blue-600 text-white' : 'bg-slate-100 text-slate-600'} flex items-center justify-center font-bold text-lg">
                        <i class="fa-solid fa-train"></i>
                    </div>
                    <div>
                        <div class="flex items-center gap-2">
                            <span class="text-xl sm:text-2xl font-black font-mono tracking-tight">${timeStr}</span>
                            <span class="text-xs px-2 py-0.5 rounded ${badgeStyle}">${statusLabel}</span>
                        </div>
                        <p class="text-xs text-slate-500 mt-0.5 font-medium">${destinationText}</p>
                    </div>
                </div>
            `;
            return div;
        }

        function renderBusSchedule() {
            const listContainer = document.getElementById('results-list');
            listContainer.innerHTML = '';

            const busData = busTimetable[state.busRoute];
            const scheduleObj = busData[state.dayType];

            const [currHour, currMin] = state.selectedTime.split(':').map(Number);
            const currentMinsTotal = currHour * 60 + currMin;

            const upcoming = [];

            for (let i = 0; i < 48; i++) {
                const checkHour = (currHour + i) % 24;
                const mins = scheduleObj[checkHour] || [];
                const sortedMins = [...mins].sort((a, b) => a - b);

                for (const m of sortedMins) {
                    const busTimeTotal = ((currHour + i) * 60) + m;
                    if (busTimeTotal >= currentMinsTotal) {
                        const formattedTime = `${String(checkHour).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
                        const diffMins = busTimeTotal - currentMinsTotal;
                        upcoming.push({ time: formattedTime, diff: diffMins });
                        if (upcoming.length === 4) break;
                    }
                }
                if (upcoming.length === 4) break;
            }

            if (upcoming.length === 0) {
                listContainer.innerHTML = `
                    <div class="text-center py-10 text-slate-400 font-medium">
                        운행 종료 또는 버스 시간표 정보가 없습니다.
                    </div>
                `;
                return;
            }

            upcoming.forEach((item, index) => {
                const isNext = index === 0;
                const cardStyle = isNext 
                    ? "bg-gradient-to-r from-cyan-50 to-blue-50 border-cyan-300 shadow-sm ring-1 ring-cyan-400/30" 
                    : "bg-white border-slate-200 text-slate-800";
                
                const badgeStyle = isNext ? "bg-cyan-600 text-white font-bold" : "bg-slate-100 text-slate-600";

                const div = document.createElement('div');
                div.className = `bus-item flex items-center justify-between p-4 rounded-xl border ${cardStyle} transition-all`;
                div.innerHTML = `
                    <div class="flex items-center gap-3 sm:gap-4">
                        <div class="w-10 h-10 sm:w-12 sm:h-12 rounded-full ${isNext ? 'bg-cyan-600 text-white' : 'bg-slate-100 text-slate-600'} flex items-center justify-center font-bold text-lg">
                            <i class="fa-solid fa-bus"></i>
                        </div>
                        <div>
                            <div class="flex items-center gap-2">
                                <span class="bus-rank text-xs px-2 py-0.5 rounded ${badgeStyle}">${index + 1}번째 버스</span>
                                <span class="text-xs text-slate-500 font-semibold">${item.diff === 0 ? '곧 출발' : item.diff + '분 후'}</span>
                            </div>
                            <span class="bus-time text-xl sm:text-2xl font-black font-mono tracking-tight text-slate-800">${item.time}</span>
                        </div>
                    </div>
                `;
                listContainer.appendChild(div);
            });
        }

        function copyBusResults() {
            const items = document.querySelectorAll('.bus-item');
            if (items.length === 0) {
                alert('복사할 버스 결과가 없습니다.');
                return;
            }

            const routeName = busTimetable[state.busRoute].label;
            const text = `[${routeName}] \n` + Array.from(items).map(item => {
                const rank = item.querySelector('.bus-rank').textContent;
                const time = item.querySelector('.bus-time').textContent;
                return `${rank}: ${time}`;
            }).join('\n');

            const copyBtn = document.getElementById('btn-copy-bus');
            
            const textarea = document.createElement('textarea');
            textarea.value = text;
            document.body.appendChild(textarea);
            textarea.select();
            try {
                document.execCommand('copy');
                const originalContent = copyBtn.innerHTML;
                copyBtn.innerHTML = `<i class="fa-solid fa-check text-green-600"></i> 복사 완료!`;
                setTimeout(() => {
                    copyBtn.innerHTML = originalContent;
                }, 2000);
            } catch (err) {
                alert('복사에 실패했습니다.');
            }
            document.body.removeChild(textarea);
        }

        // Initialize App on DOM Load
        window.onload = function() {
            init();
        };
    </script>
</body>
</html>
